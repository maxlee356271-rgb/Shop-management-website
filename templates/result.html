<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='result.css')}}"/>
</head>
<body>
    <nav class="navbar">
        <div id="navname">
            <h2>Shop Management</h2>
        </div>
        <div id="nav-links">
            <a href="/">Home</a>
            <a href="/cal">Calculator</a>
            <a href="/stat">Statistic</a>
            <a href="/stocks">Stocks</a>
        </div>
    </nav>
    <br><br>
    <div id="card">
        <div id="totalsold" class="card">
            <h1>Total Sold</h1>
            <p class="qty">{{ totalprice }}</p>
        </div>
        <div id="totalsoldqty" class="card">
            <h1>Total Sold QTY</h1>
            <p class="qty">{{ totalqty }}</p>
        </div>
        <div id="tps" class="card">
            <h1>Tps</h1>
            <p class="name">{{ tpsname }}</p>
            <p class="qty">{{ tps }}</p>
        </div>
        <div id="tpqty" class="card">
            <h1>Tpqty</h1>
            <p class="name">{{ tpqtyname }}</p>
            <p class="qty">{{ tpqty }}</p>
        </div>
    </div>
    <div id="tablecard">
        <table>
            <tr>
                <th>Product</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Average</th>
            </tr>

            {% for row in rows %}
            <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>{{ row[2] }}</td>
                <td>{{ row[3] }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
